syntax = "proto3";

package sandbox.shipments.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Sandbox.Contracts";

enum ShipmentStatus {
  SHIPMENT_STATUS_UNSPECIFIED = 0;
  SHIPMENT_STATUS_CREATED = 1;
  SHIPMENT_STATUS_IN_TRANSIT = 2;
  SHIPMENT_STATUS_DELIVERED = 3;
  SHIPMENT_STATUS_FAILED = 4;
}

message TrackingCheckpoint {
  google.protobuf.Timestamp recorded_at = 1;
  string location = 2;
  ShipmentStatus status = 3;
  repeated Scan scans = 4;
}

message Scan {
  string code = 1;
  google.protobuf.StringValue operator_note = 2;
}

message ShipmentDocuments {
  repeated Document labels = 1;
  repeated Document customs_forms = 2;
}

message Document {
  string id = 1;
  google.protobuf.Int32Value pages = 2;
}

message DeliveredInfo {
  google.protobuf.Timestamp delivered_at = 1;
  string signed_by = 2;
}

message FailedDelivery {
  string reason = 1;
  google.protobuf.Int32Value retry_count = 2;
}
