name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            integration: true
          - name: Windows
            os: windows-latest
            integration: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Git for Windows defaults to core.autocrlf=true. SQL and shell scripts
      # in this repo must stay LF (.gitattributes); reset after disabling
      # autocrlf so the Windows job matches the committed line endings.
      - name: Preserve LF line endings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git reset --hard HEAD

      # Migrations added by the PR must be newer than every migration on the base
      # branch, and changed snapshots must descend from the base snapshot.
      - name: Migration versions
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        shell: bash
        run: |
          unshallow=()
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then unshallow=(--unshallow); fi
          git fetch --no-tags "${unshallow[@]}" origin \
            "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" \
            "+${GITHUB_REF}:refs/remotes/origin/pr-merge"
          scripts/check-migration-versions.test.sh
          scripts/check-migration-versions.sh "origin/${GITHUB_BASE_REF}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            !~/.nuget/packages/clickhouseschemagen.*
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      # nuget.config points at ./artifacts/nuget for local packs. The folder is
      # gitignored, and NuGet fails restore when a local source is missing.
      - name: Prepare local NuGet source
        shell: bash
        run: mkdir -p artifacts/nuget

      - name: Restore
        run: dotnet restore kafka2ch.sln

      - name: Build
        run: dotnet build kafka2ch.sln --configuration Release --no-restore

      - name: Codegen up-to-date
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cli=tools/ClickHouseSchemaGen.Cli/bin/Release/net8.0/ClickHouseSchemaGen.Cli.dll
          contracts=src/Sandbox.Contracts/bin/Release/net8.0/Sandbox.Contracts.dll
          for config in clickhouse.codegen.json clickhouse.codegen.cluster.json clickhouse.codegen.cluster.replicated-db.json; do
            dotnet exec "$cli" generate --config "src/Sandbox.Contracts/$config" --assemblies "$contracts"
            dotnet exec "$cli" migrate versions --config "src/Sandbox.Contracts/$config"
            dotnet exec "$cli" migrate status --config "src/Sandbox.Contracts/$config" --assemblies "$contracts"
          done
          if ! git diff --exit-code -- docker/ || [ -n "$(git status --porcelain --untracked-files=all -- docker/)" ]; then
            git status --short -- docker/
            echo "::error::Generated artifacts under docker/ are stale. Rebuild src/Sandbox.Contracts (or run the CLI for all three configs) and commit the result."
            exit 1
          fi

      - name: Migration versions match across topologies
        run: dotnet exec tools/ClickHouseSchemaGen.Cli/bin/Release/net8.0/ClickHouseSchemaGen.Cli.dll migrate verify --all-topologies src/Sandbox.Contracts/clickhouse.topologies.json

      - name: Unit tests
        run: dotnet test tests/ClickHouseSchemaGen.UnitTests/ClickHouseSchemaGen.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      # Testcontainers starts Linux ClickHouse images. GitHub-hosted Windows
      # runners only expose a Windows container daemon, so integration tests
      # run on the Linux job.
      - name: Integration tests
        if: matrix.integration
        run: dotnet test tests/ClickHouseSchemaGen.IntegrationTests/ClickHouseSchemaGen.IntegrationTests.csproj --configuration Release --no-build --logger "trx;LogFileName=integration-tests.trx" --results-directory TestResults -- xUnit.MaxParallelThreads=2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults
          if-no-files-found: ignore

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            !~/.nuget/packages/clickhouseschemagen.*
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pack and verify
        run: ./scripts/pack-verify.sh

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/ClickHouseSchemaGen*.nupkg
          if-no-files-found: ignore

  migrations-apply:
    name: Migrations apply (${{ matrix.topology }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - topology: single-node
            compose-files: docker-compose.yml
            migrations: docker/clickhouse/migrations
          - topology: cluster
            compose-files: docker-compose.yml:docker-compose.cluster.yml
            migrations: docker/clickhouse-cluster/migrations
          - topology: cluster-replicated-db
            compose-files: docker-compose.yml:docker-compose.cluster.yml:docker-compose.cluster.replicated-db.yml
            migrations: docker/clickhouse-cluster/migrations-replicated-db
    env:
      COMPOSE_FILE: ${{ matrix.compose-files }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build migrator image
        run: docker compose build clickhouse-migrate

      # Init records every committed migration in schema_migrations, so the
      # first run only checks checksums. Dropping those rows makes the second
      # run execute each migration file against the initialized topology.
      - name: Init and migrate
        run: docker compose run --rm clickhouse-migrate

      - name: Replay committed migrations
        run: |
          docker exec clickhouse clickhouse-client --password sandbox \
            --query "ALTER TABLE default.schema_migrations DELETE WHERE kind = 'migration' SETTINGS mutations_sync = 2"
          docker compose run --rm clickhouse-migrate

      - name: Migrate is idempotent
        run: |
          docker compose run --rm clickhouse-migrate
          expected=$(find "${{ matrix.migrations }}" -maxdepth 1 -name '*.sql' | wc -l)
          applied=$(docker exec clickhouse clickhouse-client --password sandbox \
            --query "SELECT count() FROM default.schema_migrations WHERE kind = 'migration'")
          docker exec clickhouse clickhouse-client --password sandbox --format PrettyCompact \
            --query "SELECT version, name, kind, applied_at FROM default.schema_migrations ORDER BY kind, version"
          if [ "$applied" != "$expected" ]; then
            echo "::error::Expected $expected applied migrations, found $applied."
            exit 1
          fi

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
