rule_files:
  - ../alerts/clickhouse-kafka.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'ClickHouseProfileEvents_KafkaCommits{job="clickhouse",instance="clickhouse:9363"}'
        values: '5x15'
      - series: 'ClickHouseProfileEvents_KafkaMessagesPolled{job="clickhouse",instance="clickhouse:9363"}'
        values: '0+10x15'
      - series: 'ClickHouseProfileEvents_KafkaMessagesFailed{job="clickhouse",instance="clickhouse:9363"}'
        values: '0x10 1x5'
      - series: 'ClickHouseMetrics_KafkaAssignedPartitions{job="clickhouse",instance="clickhouse:9363"}'
        values: '1x5 0x10'
    alert_rule_test:
      - eval_time: 12m
        alertname: ClickHouseKafkaNoCommits
        exp_alerts:
          - exp_labels:
              job: clickhouse
              severity: critical
            exp_annotations:
              summary: Kafka engine polls messages but has not committed offsets for 10 minutes
              description: >-
                Messages are polled but no offsets were committed: the block insert into the
                materialized views keeps failing (poison message without kafka_handle_error_mode,
                target table errors). Check system.kafka_consumers.exceptions and the ClickHouse log.
      - eval_time: 12m
        alertname: ClickHouseKafkaParseErrors
        exp_alerts:
          - exp_labels:
              job: clickhouse
              instance: clickhouse:9363
              severity: warning
            exp_annotations:
              summary: Kafka engine failed to parse messages in the last 5 minutes
              description: >-
                With kafka_handle_error_mode = 'stream' broken messages land in {queue}_errors
                (orders_queue_errors); inspect _topic/_partition/_offset/_error there.
      - eval_time: 5m
        alertname: ClickHouseKafkaParseErrors
        exp_alerts: []
      - eval_time: 8m
        alertname: ClickHouseKafkaNoAssignments
        exp_alerts: []
      - eval_time: 12m
        alertname: ClickHouseKafkaNoAssignments
        exp_alerts:
          - exp_labels:
              job: clickhouse
              severity: critical
            exp_annotations:
              summary: No Kafka partitions are assigned to ClickHouse consumers
              description: >-
                Consumers of every Kafka engine table hold no partition assignments: broker
                unavailable, consumer group rebalancing, or the queue table / its materialized views
                were dropped. Check system.kafka_consumers and kafka-consumer-groups --describe.

  - interval: 1m
    input_series:
      - series: 'ClickHouseProfileEvents_KafkaCommits{job="clickhouse",instance="clickhouse:9363"}'
        values: '5x15'
      - series: 'ClickHouseProfileEvents_KafkaMessagesPolled{job="clickhouse",instance="clickhouse:9363"}'
        values: '100x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ClickHouseKafkaNoCommits
        exp_alerts: []
