rule_files:
  - ../alerts/clickhouse-kafka.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'ClickHouseProfileEvents_KafkaCommits{job="clickhouse",instance="clickhouse:9363"}'
        values: '5x15'
      - series: 'ClickHouseProfileEvents_KafkaMessagesPolled{job="clickhouse",instance="clickhouse:9363"}'
        values: '0+10x15'
      - series: 'ClickHouseProfileEvents_KafkaMessagesFailed{job="clickhouse",instance="clickhouse:9363"}'
        values: '0x10 1x5'
      - series: 'ClickHouseMetrics_KafkaAssignedPartitions{job="clickhouse",instance="clickhouse:9363"}'
        values: '1x5 0x10'
    alert_rule_test:
      - eval_time: 12m
        alertname: ClickHouseKafkaNoCommits
        exp_alerts:
          - exp_labels:
              job: clickhouse
              severity: critical
            exp_annotations:
              summary: Kafka engine polls messages but has not committed offsets for 10 minutes
              description: >-
                Messages are polled but no offsets were committed: the block insert into the
                materialized views keeps failing (poison message without kafka_handle_error_mode,
                target table errors). Check system.kafka_consumers.exceptions and the ClickHouse log.
      - eval_time: 12m
        alertname: ClickHouseKafkaParseErrors
        exp_alerts:
          - exp_labels:
              job: clickhouse
              instance: clickhouse:9363
              severity: warning
            exp_annotations:
              summary: Kafka engine failed to parse messages in the last 5 minutes
              description: >-
                With kafka_handle_error_mode = 'stream' broken messages land in {queue}_errors
                (orders_queue_errors); inspect _topic/_partition/_offset/_error there.
      - eval_time: 5m
        alertname: ClickHouseKafkaParseErrors
        exp_alerts: []
      - eval_time: 8m
        alertname: ClickHouseKafkaNoAssignments
        exp_alerts: []
      - eval_time: 12m
        alertname: ClickHouseKafkaNoAssignments
        exp_alerts:
          - exp_labels:
              job: clickhouse
              severity: critical
            exp_annotations:
              summary: No Kafka partitions are assigned to ClickHouse consumers
              description: >-
                Consumers of every Kafka engine table hold no partition assignments: broker
                unavailable, consumer group rebalancing, or the queue table / its materialized views
                were dropped. Check system.kafka_consumers and kafka-consumer-groups --describe.

  - interval: 1m
    input_series:
      - series: 'ClickHouseProfileEvents_KafkaCommits{job="clickhouse",instance="clickhouse:9363"}'
        values: '5x15'
      - series: 'ClickHouseProfileEvents_KafkaMessagesPolled{job="clickhouse",instance="clickhouse:9363"}'
        values: '100x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ClickHouseKafkaNoCommits
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'clickhouse_orders_cross_shard_dupes{job="clickhouse-sql"}'
        values: '0x4 2x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: ClickHouseOrdersCrossShardDuplicates
        exp_alerts: []
      - eval_time: 10m
        alertname: ClickHouseOrdersCrossShardDuplicates
        exp_alerts:
          - exp_labels:
              job: clickhouse-sql
              severity: warning
            exp_annotations:
              summary: Cross-shard duplicate order_id after Kafka consumer rebalance
              description: >-
                count() FROM orders FINAL exceeds uniqExact(order_id): a redelivered message
                likely landed on another shard (MV writes to *_local; FINAL dedupes per shard only).
                Run scripts/verify-cluster.sh and follow the N1 A1 reconcile steps in docs/observability.md.

  - interval: 1m
    input_series:
      - series: 'clickhouse_view_refresh_last_success_age_seconds{job="clickhouse-sql",view="orders_agg_mv"}'
        values: '30x3 150x5'
      - series: 'clickhouse_view_refresh_exceptions{job="clickhouse-sql",view="orders_agg_mv"}'
        values: '0x4 1x4'
      - series: 'clickhouse_orders_queue_errors_total{job="clickhouse-sql"}'
        values: '0x3 0+2x6'
    alert_rule_test:
      - eval_time: 3m
        alertname: ClickHouseViewRefreshStuck
        exp_alerts: []
      - eval_time: 8m
        alertname: ClickHouseViewRefreshStuck
        exp_alerts:
          - exp_labels:
              job: clickhouse-sql
              view: orders_agg_mv
              severity: warning
            exp_annotations:
              summary: Refreshable aggregate view has not succeeded for over 2 minutes
              description: >-
                system.view_refreshes.last_success_time for orders_agg_mv is older than two
                REFRESH intervals. Check exception/retry in system.view_refreshes and SYSTEM REFRESH VIEW.
      - eval_time: 4m
        alertname: ClickHouseViewRefreshException
        exp_alerts: []
      - eval_time: 6m
        alertname: ClickHouseViewRefreshException
        exp_alerts:
          - exp_labels:
              job: clickhouse-sql
              view: orders_agg_mv
              severity: warning
            exp_annotations:
              summary: Refreshable aggregate view reports a non-empty exception
              description: >-
                system.view_refreshes.exception is set for orders_agg_mv. Inspect the text,
                fix the query/source, then SYSTEM REFRESH VIEW / SYSTEM WAIT VIEW.
      - eval_time: 3m
        alertname: ClickHouseOrdersQueueErrorsGrowth
        exp_alerts: []
      - eval_time: 8m
        alertname: ClickHouseOrdersQueueErrorsGrowth
        exp_alerts:
          - exp_labels:
              job: clickhouse-sql
              severity: warning
            exp_annotations:
              summary: orders_queue_errors row count grew in the last 5 minutes
              description: >-
                Poison / parse failures are landing in orders_queue_errors (handle_error_mode=stream).
                Inspect _topic/_partition/_offset/_error; see docs/observability.md.

  - interval: 1m
    input_series:
      - series: 'clickhouse_kafka_queue_without_mv{job="clickhouse-sql",host="clickhouse"}'
        values: '0x3 1x7'
      - series: 'clickhouse_kafka_queue_missing{job="clickhouse-sql",host="clickhouse"}'
        values: '0x3 1x7'
    alert_rule_test:
      - eval_time: 4m
        alertname: ClickHouseKafkaQueueWithoutMv
        exp_alerts: []
      - eval_time: 4m
        alertname: ClickHouseKafkaQueueMissing
        exp_alerts: []
      - eval_time: 9m
        alertname: ClickHouseKafkaQueueWithoutMv
        exp_alerts:
          - exp_labels:
              job: clickhouse-sql
              host: clickhouse
              severity: critical
            exp_annotations:
              summary: orders_queue is attached without orders_mv dependency
              description: >-
                system.tables shows orders_queue (Kafka) but dependencies_table does not contain
                orders_mv. Kafka logs "No attached views" and does not stream. Typical after a killed
                migrate (ATTACH/CREATE without CREATE MV) or intentional non-restore when queue schema
                changed. Rerun one Migrator Job after the lock is gone; see docs/migrate-runbook.md.
      - eval_time: 9m
        alertname: ClickHouseKafkaQueueMissing
        exp_alerts:
          - exp_labels:
              job: clickhouse-sql
              host: clickhouse
              severity: critical
            exp_annotations:
              summary: orders_queue is neither attached nor detached
              description: >-
                orders_queue is absent from system.tables and system.detached_tables — the drill
                state after DROP and before CREATE, or a failed replay. Rerun one Migrator Job after
                the lock TTL / dead owner cleanup; Migrator skips ATTACH when the table is fully gone
                so DROP/CREATE can heal. See docs/migrate-runbook.md.
