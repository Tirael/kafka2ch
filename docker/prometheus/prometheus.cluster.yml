global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: clickhouse
    static_configs:
      - targets:
          - clickhouse:9363
          - clickhouse-02:9363
          - clickhouse-03:9363
          - clickhouse-04:9363
