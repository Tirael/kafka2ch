x-user-defined-replicated: &user-defined-replicated
  volumes:
    - ./docker/clickhouse-cluster/config/user-defined-replicated.xml:/etc/clickhouse-server/config.d/user-defined-replicated.xml:ro

services:
  clickhouse:
    <<: *user-defined-replicated

  clickhouse-02:
    <<: *user-defined-replicated

  clickhouse-03:
    <<: *user-defined-replicated

  clickhouse-04:
    <<: *user-defined-replicated

  clickhouse-cluster-init:
    environment:
      CLICKHOUSE_DATABASE: kafka2ch
      INIT_DIR: /cluster/init-replicated-db

  clickhouse-migrate:
    environment:
      ClickHouse__Cluster: kafka2ch
      ClickHouse__DdlMode: replicatedDatabase
      ClickHouse__Database: kafka2ch
    volumes: !override
      - ./docker/clickhouse-cluster/migrations-replicated-db:/migrations:ro

  sandbox-app:
    environment:
      ClickHouse__Database: kafka2ch
      ReadAggregates__Database: default
